x-airflow-common: &airflow-common
  build: .
  image: olist-airflow:2.9.3
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/airflow"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}"
    AZURE_STORAGE_ACCOUNT: "${AZURE_STORAGE_ACCOUNT:-storageemulator}"
    AZURE_STORAGE_CONTAINER: "${AZURE_STORAGE_CONTAINER:-olist-data}"
    AZURE_STORAGE_KEY: "${AZURE_STORAGE_KEY:-}"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./spark:/opt/airflow/project/spark:ro
    - ./data/olist:/opt/airflow/data/olist:ro
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --username admin --firstname Airflow --lastname Admin \
          --role Admin --email admin@example.com --password "$$AIRFLOW_ADMIN_PASSWORD"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    hostname: azurite
    network_mode: service:azurite
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      azurite:
        condition: service_started

volumes:
  postgres-data:
  azurite-data:
  airflow-logs:
