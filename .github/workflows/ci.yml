name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install pytest ruff "dbt-spark[session]==1.9.2"
      - name: Run tests
        run: python -m pytest tests -v
      - name: Lint Python
        run: ruff check spark dags tests
      - name: Parse dbt project
        run: dbt parse --project-dir dbt --profiles-dir dbt
